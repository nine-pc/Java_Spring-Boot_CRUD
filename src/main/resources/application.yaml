spring:
  application:
    name: spring-crud

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 111111

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080